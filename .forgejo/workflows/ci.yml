name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  backend:
    runs-on: docker
    container:
      image: rust:1.96-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y pkg-config libssl-dev g++ perl make
      - name: Add toolchain components
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  frontend:
    runs-on: docker
    container:
      image: node:24-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
