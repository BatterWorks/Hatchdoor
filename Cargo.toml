[package]
name = "hatchdoor"
version = "2.10.1"
edition = "2024"
default-run = "hatchdoor"
license = "AGPL-3.0-only"
description = "Self-hosted Obsidian-style Markdown vault browser with optional web and MCP write access"
repository = "https://github.com/BatterWorks/Hatchdoor"
readme = "README.md"
keywords = ["markdown", "obsidian", "mcp", "search", "self-hosted"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
ahash = "0.8"
arc-swap = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
blake3 = "1"
bytemuck = "1"
# Inference backend for the benchmark-only Qwen3 and Nomic v2 MoE embedders.
# Optional, and reachable only through the `eval` feature: a default build ships
# the ONNX embedders alone and compiles no candle crates.
candle-core = { version = "0.11", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
fastembed = "5"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https"] }
getrandom = "0.4"
ignore = "0.4"
libc = "0.2"
notify = "8"
# SHA-256 for checking model files against the digests `model_setup.rs`
# ships (#643). Already compiled through ureq's rustls; this only makes the edge direct.
ring = "0.17"
rmcp = { version = "=3.8.0", features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlite-vec = "0.1"
text-splitter = { version = "0.33", features = ["markdown", "tokenizers"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# FastEmbed 5 exposes its model tokenizer through tokenizers 0.22, while
# text-splitter (application chunking) uses 0.23. Keep this version-matched
# alias for the read-only index microbenchmark, which inspects the FastEmbed
# model tokenizer directly and must speak its exact API version. Optional for
# the same reason as candle-core: the microbenchmark is `eval`-only. Note this
# only drops Hatchdoor's own edge — fastembed depends on tokenizers 0.22
# unconditionally, so the second copy is still compiled by a default build.
tokenizers-fe = { package = "tokenizers", version = "0.22", default-features = false, features = ["onig"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
# ADR-39: the opt-in update check. Already compiled through hf-hub, which
# downloads the search models with it; this only makes the edge direct.
ureq = { version = "3.3", default-features = false, features = ["json", "native-tls"] }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
default = []
embedder-tests = []
# The offline benchmark harness: the `eval` and `index_microbench` binaries, the
# candle-backed embedders they sweep, and the dependencies only those reach.
# Non-default on purpose — a benchmark sweep is not something a deployment runs,
# so no deployment should pay to compile its inference stack. Measured effect on
# `cargo tree --edges normal`: 368 unique crates down to 351, the 17 removed
# being exactly the candle subtree.
eval = ["dep:candle-core", "dep:tokenizers-fe", "fastembed/qwen3", "fastembed/nomic-v2-moe"]

# Both binaries are `eval`-only; declared explicitly so a default build skips
# them rather than failing on their missing dependencies.
[[bin]]
name = "eval"
path = "src/bin/eval.rs"
required-features = ["eval"]

[[bin]]
name = "index_microbench"
path = "src/bin/index_microbench.rs"
required-features = ["eval"]

# The dependencies the tests run hard build optimised even in debug and test
# builds. Everything else stays at the default opt-level 0: Hatchdoor's own
# crate, macros, build scripts, and dependencies the tests barely run, such as
# libgit2's C build and the image crates fastembed pulls in. Vendored OpenSSL's
# C code builds at -O2 whatever this says: `openssl-src` sets it.
# Optimising every dependency made the cargo steps of `just check-full` take
# 51 to 57 minutes from an empty target folder on a 4-core VM; this list takes
# 27 to 29. The two warm test runs take 2 to 3% longer together, the
# default-features one about 6% (1.6 s) on its own (#795). A dependency the
# tests need fast and this list misses shows up as a slow or timed-out test:
# compare per-test times with libtest's `--report-time` and add the crate whose
# code the slow test runs. Release builds are unaffected; the image's
# `verification` stage tests with this profile too.
[profile.dev.package]
# The database and its vector extension.
rusqlite = { opt-level = 2 }
libsqlite3-sys = { opt-level = 2 }
sqlite-vec = { opt-level = 2 }
# Tokenizing and chunking: the search models' tokenizers and the splitter.
tokenizers = { opt-level = 2 }
onig = { opt-level = 2 }
onig_sys = { opt-level = 2 }
esaxx-rs = { opt-level = 2 }
spm_precompiled = { opt-level = 2 }
daachorse = { opt-level = 2 }
unicode-normalization-alignments = { opt-level = 2 }
unicode_categories = { opt-level = 2 }
regex = { opt-level = 2 }
regex-automata = { opt-level = 2 }
regex-syntax = { opt-level = 2 }
aho-corasick = { opt-level = 2 }
memchr = { opt-level = 2 }
text-splitter = { opt-level = 2 }
pulldown-cmark = { opt-level = 2 }
unicode-segmentation = { opt-level = 2 }
icu_segmenter = { opt-level = 2 }
icu_collections = { opt-level = 2 }
# Running the search models.
fastembed = { opt-level = 2 }
ort = { opt-level = 2 }
ndarray = { opt-level = 2 }
matrixmultiply = { opt-level = 2 }
# Hashing, Unicode normal forms, frontmatter and JSON.
blake3 = { opt-level = 2 }
ring = { opt-level = 2 }
unicode-normalization = { opt-level = 2 }
serde_json = { opt-level = 2 }
serde_yaml_ng = { opt-level = 2 }
unsafe-libyaml = { opt-level = 2 }
# Deflate, for the zip downloads.
flate2 = { opt-level = 2 }
miniz_oxide = { opt-level = 2 }
zlib-rs = { opt-level = 2 }
crc32fast = { opt-level = 2 }
adler2 = { opt-level = 2 }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }
