services:
  hatchdoor:
    image: battermanz/hatchdoor:latest
    container_name: hatchdoor
    env_file:
      - .env
    environment:
      # The process must bind the container interface for Docker port publishing
      # to work. Set HATCHDOOR_WEB_BEARER_TOKEN in .env before running compose.
      HOST: 0.0.0.0
    ports:
      - "42824:42824"
    volumes:
      - ${HOST_VAULT_PATH:-./vault}:/data/vault
      - ${HOST_CACHE_PATH:-./data/cache}:/data/cache
    restart: unless-stopped
    healthcheck:
      # Distroless runtime has no shell/curl, so the binary probes its own
      # /health endpoint (which also pings SQLite) and exits non-zero on failure.
      test: ["CMD", "/app/hatchdoor", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
